services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Instagram DM Automation
      APP_ENV: development
      DEBUG: "true"
      API_V1_PREFIX: /api/v1
      SECRET_KEY: dev-only-change-me
      META_APP_ID: ""
      META_APP_SECRET: ""
      META_REDIRECT_URI: http://localhost:8000/api/v1/instagram/callback
      META_API_VERSION: ""
      META_GRAPH_BASE_URL: https://graph.instagram.com
      META_WEBHOOK_VERIFY_TOKEN: dev-verify-token
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TASK_EXECUTION_MODE: inline
      JWT_SECRET: dev-only-change-me
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      LOG_LEVEL: INFO
      MOCK_EXTERNAL_SERVICES: "true"
      SEED_DEMO_DATA: "false"
      CORS_ORIGINS: http://localhost:5173
      TRUSTED_HOSTS: localhost,127.0.0.1,api,testserver
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    environment:
      APP_NAME: Instagram DM Automation
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: dev-only-change-me
      META_APP_SECRET: ""
      META_WEBHOOK_VERIFY_TOKEN: dev-verify-token
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TASK_EXECUTION_MODE: celery
      JWT_SECRET: dev-only-change-me
      JWT_ALGORITHM: HS256
      LOG_LEVEL: INFO
      MOCK_EXTERNAL_SERVICES: "true"
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      redis:
        condition: service_healthy
