[project]
name = "instagram-dm-automation"
version = "0.1.0"
description = "Instagram comment-to-DM automation platform API"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.1.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
packages = ["app"]
exclude = ["alembic/", "tests/"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
